[project]
name = "computer-use-agents-demos"
version = "0.1.0"
description = "Local application and reference recipes for teaching and running computer-use automations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "gradium>=0.6,<0.7",
    "hai-agents>=0.1.7",   # 0.1.7 ships custom tools (@tool + run_session tools=...)
    "holo-desktop-cli>=0.0.2",
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.10",
    "pymupdf>=1.28,<2",
    "pyside6-essentials>=6.11",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35",
    "tyro>=0.9",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "playwright>=1.40",
    "httpx>=0.27",         # the SDK's transport; we catch httpx.TransportError to survive poll blips
]

[project.scripts]
automation-foundry-api = "automation_foundry.cli:main"
hai-agents-demos-qa = "examples.qa.mcp.server:main"
hai-agents-demos-extract-anything = "examples.extract_anything.server:main"
debug-qa = "examples.qa.mcp.debug:main"
qa-cli = "examples.qa.cli.main:main"
counterfeit-cli = "examples.counterfeit_detection.main:main"
extract-cli = "examples.extract_anything.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples", "src/automation_foundry"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src/automation_foundry"]
# fastmcp + a few hai_agents internals don't ship ``py.typed``; treat them as untyped imports
# rather than failing every reference to them.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[[tool.mypy.overrides]]
# The SDK's ``tool()`` decorator factory is typed ``-> Any`` (it returns either a ``Tool`` or a
# wrapping closure depending on call form), which trips ``untyped-decorator`` on every
# ``@tool(name=...)`` use. The decorator IS the pattern this example teaches, so silence that one
# code here rather than dodge the public API.
module = "examples.counterfeit_detection.local_tools"
disable_error_code = ["untyped-decorator"]
